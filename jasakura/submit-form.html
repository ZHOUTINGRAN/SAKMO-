<!-- ============ 在线投稿 ============ -->
<section style="padding-top:120px">
  <div class="wrap">
    <div class="sec-head">
      <div class="l"><h2>在线投稿<span class="en">Submit</span></h2></div>
      <div class="r">填写后生成邮件</div>
    </div>
    <p style="max-width:60ch;margin-bottom:48px;font-family:var(--serif);font-size:clamp(1.3rem,1.6vw,1.5rem);line-height:1.85;color:var(--ink-soft)">填写下方表单，提交后将自动打开邮件客户端并填充内容。也可手动发送至 <a href="mailto:sakmo@jasakura.cn" style="color:var(--ink);border-bottom:1px solid var(--ink)">sakmo@jasakura.cn</a>。</p>

    <form class="submit-form" id="submit-form" novalidate>
      <div class="field">
        <label>署名 / Name</label>
        <input type="text" name="署名" required>
      </div>
      <div class="field">
        <label>邮箱 / Email</label>
        <input type="email" name="邮箱" required>
      </div>
      <div class="field">
        <label>作品类别 / Category</label>
        <select name="作品类别">
          <option value="风光 Landscape">风光 Landscape</option>
          <option value="纪实 Documentary">纪实 Documentary</option>
          <option value="新地形 New Topographics">新地形 New Topographics</option>
          <option value="静物 Still Life">静物 Still Life</option>
          <option value="创意 Creative">创意 Creative</option>
        </select>
      </div>
      <div class="field">
        <label>投稿主题 / Theme</label>
        <select name="投稿主题">
          <option value="当期征稿「窗」">当期征稿「窗」</option>
          <option value="共创专栏「岁与光影」">共创专栏「岁与光影」</option>
          <option value="其他">其他</option>
        </select>
      </div>
      <div class="field full">
        <label>作品手记 / Note</label>
        <textarea name="作品手记" rows="3" placeholder="一句话手记：拍摄时间、地点与心情"></textarea>
      </div>
      <div class="field full">
        <label>作品链接 / Link</label>
        <input type="text" name="网盘链接" placeholder="网盘链接或附件地址（单张 / 组图打包）">
      </div>
      <div class="form-action">
        <button type="submit" class="go">提交投稿 → 生成邮件</button>
        <p class="hint">点击后将打开邮件客户端，内容已自动填充。也可手动发送至 sakmo@jasakura.cn</p>
      </div>
    </form>
  </div>
</section>

<script src="js/app.js"></script>
<script>
/* 投稿表单：收集字段 → 构造 mailto 链接 → 打开邮件客户端
   （比 form action="mailto:" 更可靠，兼容 Chrome/Edge/Safari） */
(function(){
  var form = document.getElementById('submit-form');
  if(!form) return;
  form.addEventListener('submit', function(e){
    e.preventDefault();
    var to = 'sakmo@jasakura.cn';
    var name = form.querySelector('[name="署名"]').value.trim();
    var email = form.querySelector('[name="邮箱"]').value.trim();
    var category = form.querySelector('[name="作品类别"]').value;
    var theme = form.querySelector('[name="投稿主题"]').value;
    var note = form.querySelector('[name="作品手记"]').value.trim();
    var link = form.querySelector('[name="网盘链接"]').value.trim();

    if(!name || !email){
      alert('请填写署名和邮箱');
      return;
    }

    var subject = '投稿 · 客座 · ' + name;
    var body = '署名 / Name：' + name + '\n'
             + '邮箱 / Email：' + email + '\n'
             + '作品类别 / Category：' + category + '\n'
             + '投稿主题 / Theme：' + theme + '\n'
             + '作品手记 / Note：' + note + '\n'
             + '作品链接 / Link：' + link + '\n';

    var mailtoUrl = 'mailto:' + to + '?subject=' + encodeURIComponent(subject) + '&body=' + encodeURIComponent(body);
    window.location.href = mailtoUrl;
  });
})();
</script>
