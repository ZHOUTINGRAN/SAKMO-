<script src="js/magazine-data.js"></script>

<script>
  /* 根据URL参数加载对应杂志数据 */
  (function(){
    const params = new URLSearchParams(location.search);
    const id = params.get('id') || '001';
    const list = window.magazines || [];
    const idx = list.findIndex(m => m.id === id);
    const mag = list[idx] || list[0];
    if(!mag) return;

    // 文档标题
    document.title = `${mag.title} — 樱茉序 Sakmo`;

    // 填充字段
    const set = (sel, val, attr) => {
      const el = document.querySelector(sel);
      if(!el) return;
      if(attr) el.setAttribute(attr, val);
      else el.innerHTML = val;
    };
    set('[data-field="issue"]', mag.issue);
    set('[data-field="title"]', mag.title);
    set('[data-field="cover"]', mag.cover, 'src');
    set('[data-field="cover"]', mag.title, 'alt');
    set('[data-field="description"]', mag.description);
    set('[data-field="lookInside"]', mag.lookInside, 'href');

    // 购买链接
    document.querySelectorAll('[data-shop]').forEach(a => {
      const i = +a.dataset.shop;
      const shop = mag.shops && mag.shops[i];
      if(shop){
        a.href = shop.url;
        a.querySelector('span').textContent = shop.name;
      }
    });

    // 翻页（循环）
    const prev = list[(idx - 1 + list.length) % list.length];
    const next = list[(idx + 1) % list.length];
    set('[data-field="prev"]', `magazine-detail.html?id=${prev.id}`, 'href');
    set('[data-field="next"]', `magazine-detail.html?id=${next.id}`, 'href');

    /* 生成档案杂志快捷选择卡片（基于 magazine-data.js 数据） */
    const wrapper = document.getElementById('archives-wrapper');
    if(wrapper){
      list.forEach(m => {
        const slide = document.createElement('a');
        slide.className = 'swiper-slide' + (m.id === mag.id ? ' is-current' : '');
        slide.href = `magazine-detail.html?id=${m.id}`;
        // 封面图
        const figure = document.createElement('figure');
        figure.className = 'img';
        const scale = document.createElement('span');
        scale.className = 'scale';
        const img = document.createElement('img');
        img.loading = 'lazy';
        img.src = m.cover;
        img.alt = m.title;
        scale.appendChild(img);
        figure.appendChild(scale);
        slide.appendChild(figure);
        // 文字
        const txts = document.createElement('div');
        txts.className = 'txts';
        const sSpan = document.createElement('span');
        sSpan.textContent = m.issue;
        const sP = document.createElement('p');
        sP.textContent = m.title;
        txts.appendChild(sSpan);
        txts.appendChild(sP);
        slide.appendChild(txts);
        wrapper.appendChild(slide);
      });

      // 末尾 MORE 按钮（返回杂志陈列区）
      const more = document.createElement('a');
      more.className = 'swiper-slide more-slide';
      more.href = 'index.html#magazine-archive';
      const inSpan = document.createElement('span');
      inSpan.className = 'in';
      const moreDiv = document.createElement('div');
      moreDiv.className = 'more';
      const moreSpan = document.createElement('span');
      moreSpan.textContent = 'MORE';
      const moreP = document.createElement('p');
      moreDiv.appendChild(moreSpan);
      moreDiv.appendChild(moreP);
      inSpan.appendChild(moreDiv);
      more.appendChild(inSpan);
      wrapper.appendChild(more);
    }
  })();

  /* 纯原生拖拽滑动 + 吸附动画（简洁版 · transform 平移） */
  document.querySelectorAll('.swiper-container').forEach(container => {
    const wrapper = container.querySelector('.swiper-wrapper');
    const slides = Array.from(wrapper.children);
    let isDown = false, startX = 0, currentX = 0, prevX = 0, index = 0, moved = false;

    const getX = e => e.clientX || (e.touches && e.touches[0].clientX);
    /* offsetWidth 已含 padding（box-sizing:border-box），slide 间紧贴，故直接用 offsetWidth */
    const slideW = () => slides[0].offsetWidth;

    const setTransform = () => {
      wrapper.style.transform = `translateX(${currentX}px)`;
    };

    /* 初始定位到当前杂志（.is-current） */
    const currentIdx = slides.findIndex(s => s.classList.contains('is-current'));
    if(currentIdx > 0){
      index = currentIdx;
      currentX = -index * slideW();
      wrapper.style.transition = 'none';
      setTransform();
      wrapper.offsetWidth;  /* 强制重排，确保 transition:none 生效 */
      wrapper.style.transition = '';
    }

    const onDown = e => {
      isDown = true;
      moved = false;
      startX = getX(e);
      prevX = currentX;
      wrapper.style.transition = 'none';
      /* 鼠标事件阻止默认行为，避免浏览器触发原生图片「幽灵拖拽」 */
      if(e.type === 'mousedown'){ e.preventDefault(); }
    };

    const onMove = e => {
      if(!isDown) return;
      const x = getX(e);
      const delta = x - startX;
      if(Math.abs(delta) > 5) moved = true;  /* 位移超过 5px 视为拖拽 */
      currentX = prevX + delta;
      /* 边界约束：不允许拖出第一张之前或最后一张之后，避免露出空白 */
      const min = -((slides.length - 1) * slideW());
      const max = 0;
      if(currentX > max) currentX = max;
      if(currentX < min) currentX = min;
      setTransform();
      /* 鼠标拖拽中阻止文字/图片选中；touchmove 为 passive 不拦截 */
      if(e.type === 'mousemove'){ e.preventDefault(); }
    };

    const onUp = () => {
      if(!isDown) return;
      isDown = false;
      wrapper.style.transition = '';
      /* 拖到哪里就在哪里停止，不做吸附对齐 */
    };

    /* 拖拽位移超过 5px 时拦截 click，防止松手误跳转链接 */
    container.addEventListener('click', e => {
      if(moved){
        e.preventDefault();
        e.stopPropagation();
      }
    }, true);

    container.addEventListener('mousedown', onDown);
    container.addEventListener('mousemove', onMove);
    container.addEventListener('mouseup', onUp);
    container.addEventListener('mouseleave', onUp);
    container.addEventListener('touchstart', onDown, {passive: true});
    container.addEventListener('touchmove', onMove, {passive: true});
    container.addEventListener('touchend', onUp);
  });

  /* ===== 全屏杂志跨页浏览模态框（LOOK INSIDE 触发） ===== */
  /* 桌面端：两张内页图 canvas 合成为 3360×2152 单张横幅 + 3D 翻页；移动端：单页滑动 */
  (function(){
    const modal = document.getElementById('modalGallery');
    if(!modal) return;

    const closeBtn = modal.querySelector('.mg-close');
    const prevZone = modal.querySelector('.mg-prev');
    const nextZone = modal.querySelector('.mg-next');
    const count = modal.querySelector('.mg-count');

    /* 移动端单页 */
    const frame = modal.querySelector('.mg-frame');
    const singleImg = frame.querySelector('img');

    /* 桌面端合成横幅 */
    const banner = modal.querySelector('.banner');
    const bannerImg = banner.querySelector('.banner-img');
    const flipLayer = banner.querySelector('.banner-flip');
    const flipFrontImg = flipLayer.querySelector('.flip-front img');
    const flipBackImg = flipLayer.querySelector('.flip-back img');

    /* 合成横幅尺寸：3360×2152（1.56:1，接近 16:10），每跨页两张 portrait_4_3 图左右拼接 */
    const COMP_W = 3360, COMP_H = 2152;

    let gallery = [];
    let currentIdx = 0;        /* 移动端：当前页索引 */
    let currentSpread = 0;     /* 桌面端：当前跨页索引（每跨页 2 图合成 1 张） */
    let isAnimating = false;
    const FLIP_MS = 700;       /* 翻页动画时长（与 CSS transition 一致） */
    const compositeCache = {}; /* 跨页索引 → 合成 dataURL 缓存 */

    const isMobile = () => window.innerWidth < 768;

    /* 生成内页图片路径数组（8 张本地内页图，按杂志 id 索引） */
    function generateGallery(id){
      return Array.from({length:8}, (_,i) => `images/magazine/${id}/pages/${String(i+1).padStart(2,'0')}.jpg`);
    }

    /* 加载单张图片（crossOrigin 以便 canvas 读取，不污染画布） */
    function loadImage(url){
      return new Promise(resolve => {
        const im = new Image();
        im.crossOrigin = 'anonymous';
        im.onload = () => resolve(im);
        im.onerror = () => resolve(null);
        im.src = url;
      });
    }

    /* cover 拟合绘制：保持比例填满目标区域，裁切溢出 */
    function drawCover(ctx, im, dx, dy, dw, dh){
      if(!im) return;
      const sr = im.width / im.height, cr = dw / dh;
      let sw, sh, sx, sy;
      if(sr > cr){ sh = im.height; sw = sh * cr; sx = (im.width - sw) / 2; sy = 0; }
      else { sw = im.width; sh = sw / cr; sx = 0; sy = (im.height - sh) / 2; }
      ctx.drawImage(im, sx, sy, sw, sh, dx, dy, dw, dh);
    }

    /* 合成第 idx 跨页：两张图左右拼接为 3360×2152 单张 JPEG dataURL（带缓存） */
    function compositeSpread(idx){
      if(compositeCache[idx]) return Promise.resolve(compositeCache[idx]);
      const li = idx * 2, ri = idx * 2 + 1;
      const half = COMP_W / 2;
      return Promise.all([loadImage(gallery[li]), loadImage(gallery[ri])]).then(([a, b]) => {
        const c = document.createElement('canvas');
        c.width = COMP_W; c.height = COMP_H;
        const ctx = c.getContext('2d');
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, COMP_W, COMP_H);
        drawCover(ctx, a, 0, 0, half, COMP_H);
        drawCover(ctx, b, half, 0, half, COMP_H);
        const url = c.toDataURL('image/jpeg', 0.92);
        compositeCache[idx] = url;
        return url;
      });
    }

    /* 计算尺寸
       桌面端：横幅 3360:2152 ≈ 1.56:1，按窗口留白适配
       移动端：单页 4:3，沿用原比例 */
    function calcSize(){
      if(isMobile()){
        const padding = 40;
        const maxW = window.innerWidth - padding * 2;
        const maxH = window.innerHeight - padding * 2;
        const ratio = 4 / 3;
        let w, h;
        if(maxW / maxH > ratio){ h = maxH; w = h * ratio; }
        else { w = maxW; h = w / ratio; }
        return { w: Math.round(w), h: Math.round(h) };
      }
      const padding = 80;
      const maxW = window.innerWidth - padding * 2;
      const maxH = window.innerHeight - padding * 2;
      const ratio = COMP_W / COMP_H;  /* 1.5613 */
      let w, h;
      if(maxW / maxH > ratio){ h = maxH; w = h * ratio; }
      else { w = maxW; h = w / ratio; }
      return { w: Math.round(w), h: Math.round(h) };
    }

    /* 更新外框尺寸（移动端单页 / 桌面端横幅） */
    function updateFrame(){
      const { w, h } = calcSize();
      if(isMobile()){
        frame.style.width = w + 'px';
        frame.style.height = h + 'px';
      } else {
        banner.style.width = w + 'px';
        banner.style.height = h + 'px';
      }
    }

    function spreadCount(){ return Math.ceil(gallery.length / 2); }

    /* ---------- 移动端：单页显示 ---------- */
    function showSingle(idx, isFirst){
      isAnimating = true;
      currentIdx = idx;
      count.textContent = `${idx + 1} / ${gallery.length}`;
      singleImg.classList.remove('is-show');
      setTimeout(() => {
        updateFrame();
        singleImg.src = gallery[idx];
        singleImg.onload = () => {
          setTimeout(() => {
            singleImg.classList.add('is-show');
            setTimeout(() => { isAnimating = false; }, 200);
          }, isFirst ? 200 : 0);
        };
        singleImg.onerror = () => { isAnimating = false; };
      }, 150);
    }

    /* ---------- 桌面端：合成横幅显示（首次打开 / 模式切换，无翻页动画） ---------- */
    function showSpread(idx, isFirst){
      isAnimating = true;
      currentSpread = idx;
      count.textContent = `${idx + 1} / ${spreadCount()}`;
      bannerImg.classList.remove('is-show');
      updateFrame();
      compositeSpread(idx).then(url => {
        bannerImg.src = url;
        bannerImg.onload = () => {
          setTimeout(() => {
            bannerImg.classList.add('is-show');
            setTimeout(() => { isAnimating = false; }, 300);
          }, isFirst ? 250 : 0);
        };
        bannerImg.onerror = () => { isAnimating = false; };
      });
      /* 后台预生成下一跨页，保证翻页时背面图已就绪 */
      compositeSpread((idx + 1) % spreadCount());
    }

    /* 无过渡重置翻层（避免回弹动画） */
    function resetFlip(){
      flipLayer.style.transition = 'none';
      flipLayer.classList.remove('is-flip-next');
      flipLayer.classList.remove('is-flip-prev');
      void flipLayer.offsetWidth;  /* 强制重绘 */
      flipLayer.style.transition = '';
    }

    /* ---------- 桌面端：下一跨页（横幅绕垂直中轴向左翻转） ---------- */
    function flipNext(){
      if(isAnimating) return;
      isAnimating = true;
      const nextSpread = (currentSpread + 1) % spreadCount();
      compositeSpread(nextSpread).then(url => {
        flipFrontImg.src = bannerImg.src;  /* 正面：当前横幅 */
        flipBackImg.src = url;             /* 背面：下一横幅 */
        flipLayer.classList.add('is-flip-next');
        count.textContent = `${nextSpread + 1} / ${spreadCount()}`;
        setTimeout(() => {
          currentSpread = nextSpread;
          /* 翻层背面（下一横幅）已覆盖 → 更新底层图 */
          bannerImg.src = url;
          resetFlip();
          isAnimating = false;
          compositeSpread((currentSpread + 1) % spreadCount());
        }, FLIP_MS);
      });
    }

    /* ---------- 桌面端：上一跨页（横幅绕垂直中轴向右翻转） ---------- */
    function flipPrev(){
      if(isAnimating) return;
      isAnimating = true;
      const prevSpread = (currentSpread - 1 + spreadCount()) % spreadCount();
      compositeSpread(prevSpread).then(url => {
        flipFrontImg.src = bannerImg.src;  /* 正面：当前横幅 */
        flipBackImg.src = url;             /* 背面：上一横幅 */
        flipLayer.classList.add('is-flip-prev');
        count.textContent = `${prevSpread + 1} / ${spreadCount()}`;
        setTimeout(() => {
          currentSpread = prevSpread;
          bannerImg.src = url;
          resetFlip();
          isAnimating = false;
          compositeSpread((currentSpread - 1 + spreadCount()) % spreadCount());
        }, FLIP_MS);
      });
    }

    /* 打开模态框 */
    function openModal(id){
      gallery = generateGallery(id);
      Object.keys(compositeCache).forEach(k => delete compositeCache[k]);  /* 清缓存 */
      modal.classList.add('is-open');
      modal.setAttribute('aria-hidden', 'false');
      document.body.classList.add('is-hidden');
      if(isMobile()){
        frame.style.width = '0px';
        frame.style.height = '0px';
      } else {
        updateFrame();  /* 桌面端：立即设置真实尺寸，靠 opacity+scale 入场 */
      }
      /* 延迟 200ms（等模态框淡入）后显示第一跨页/第一页 */
      setTimeout(() => {
        if(isMobile()) showSingle(0, true);
        else showSpread(0, true);
      }, 200);
    }

    /* 关闭模态框 */
    function closeModal(){
      modal.classList.remove('is-open');
      modal.setAttribute('aria-hidden', 'true');
      document.body.classList.remove('is-hidden');
      singleImg.classList.remove('is-show');
      bannerImg.classList.remove('is-show');
      resetFlip();
    }

    /* 下一页 / 上一页（按模式分发） */
    function next(){
      if(isAnimating) return;
      if(isMobile()) showSingle((currentIdx + 1) % gallery.length);
      else flipNext();
    }
    function prev(){
      if(isAnimating) return;
      if(isMobile()) showSingle((currentIdx - 1 + gallery.length) % gallery.length);
      else flipPrev();
    }

    /* 事件绑定 */
    closeBtn.addEventListener('click', closeModal);
    nextZone.addEventListener('click', next);
    prevZone.addEventListener('click', prev);
    /* 点击横幅翻页：左半 → 上一页，右半 → 下一页（翻层 pointer-events:none，点击穿透） */
    banner.addEventListener('click', e => {
      const rect = banner.getBoundingClientRect();
      if(e.clientX - rect.left < rect.width / 2) prev(); else next();
    });

    /* 键盘控制：← → 翻页，ESC 关闭 */
    document.addEventListener('keydown', e => {
      if(!modal.classList.contains('is-open')) return;
      if(e.key === 'Escape') closeModal();
      if(e.key === 'ArrowLeft') prev();
      if(e.key === 'ArrowRight') next();
    });

    /* 窗口调整：重新计算尺寸；模式切换时重绘当前页 */
    let lastMobile = isMobile();
    window.addEventListener('resize', () => {
      if(!modal.classList.contains('is-open')){ lastMobile = isMobile(); return; }
      const nowMobile = isMobile();
      if(nowMobile !== lastMobile){
        lastMobile = nowMobile;
        if(nowMobile){
          currentIdx = currentSpread * 2;
          showSingle(currentIdx, true);
        } else {
          currentSpread = Math.floor(currentIdx / 2);
          showSpread(currentSpread, true);
        }
      } else {
        updateFrame();
      }
    });

    /* 移动端滑动手势（阈值 50px） */
    let touchStartX = 0;
    modal.addEventListener('touchstart', e => {
      touchStartX = e.touches[0].clientX;
    }, { passive: true });
    modal.addEventListener('touchend', e => {
      const delta = e.changedTouches[0].clientX - touchStartX;
      if(Math.abs(delta) > 50){
        if(delta > 0) prev(); else next();
      }
    }, { passive: true });

    /* 拦截 LOOK INSIDE 按钮点击 → 打开模态框 */
    const lookInsideBtn = document.querySelector('[data-field="lookInside"]');
    if(lookInsideBtn){
      lookInsideBtn.addEventListener('click', e => {
        e.preventDefault();
        const params = new URLSearchParams(location.search);
        const id = params.get('id') || '001';
        openModal(id);
      });
    }
  })();
</script>
