<script>
  /* 根据URL参数加载对应杂志数据 */
  (function(){
    const params = new URLSearchParams(location.search);
    const id = params.get('id') || '001';
    const list = window.magazines || [];
    const idx = list.findIndex(m => m.id === id);
    const mag = list[idx] || list[0];
    if(!mag) return;

    // 文档标题
    document.title = `${mag.title} — 樱茉序 Sakmo`;

    // 填充字段
    const set = (sel, val, attr) => {
      const el = document.querySelector(sel);
      if(!el) return;
      if(attr) el.setAttribute(attr, val);
      else el.innerHTML = val;
    };
    set('[data-field="issue"]', mag.issue);
    set('[data-field="title"]', mag.title);
    set('[data-field="cover"]', mag.cover, 'src');
    set('[data-field="cover"]', mag.title, 'alt');
    /* description 支持字符串或数组（多段文字） */
    var descEl = document.querySelector('[data-field="description"]');
    if(descEl){
      if(Array.isArray(mag.description)){
        descEl.innerHTML = mag.description.map(function(p){ return '<p>' + p + '</p>'; }).join('');
      } else {
        descEl.textContent = mag.description;
      }
    }
    set('[data-field="lookInside"]', mag.lookInside, 'href');

    // 购买链接
    document.querySelectorAll('[data-shop]').forEach(a => {
      const i = +a.dataset.shop;
      const shop = mag.shops && mag.shops[i];
      if(shop){
        a.href = shop.url;
        a.querySelector('span').textContent = shop.name;
      }
    });

    // 翻页（循环）
    const prev = list[(idx - 1 + list.length) % list.length];
    const next = list[(idx + 1) % list.length];
    set('[data-field="prev"]', `magazine-detail.html?id=${prev.id}`, 'href');
    set('[data-field="next"]', `magazine-detail.html?id=${next.id}`, 'href');

    /* 生成档案杂志快捷选择卡片（基于 magazine-data.js 数据） */
    const wrapper = document.getElementById('archives-wrapper');
    if(wrapper){
      list.forEach(m => {
        const slide = document.createElement('a');
        slide.className = 'swiper-slide' + (m.id === mag.id ? ' is-current' : '');
        slide.href = `magazine-detail.html?id=${m.id}`;
        // 封面图
        const figure = document.createElement('figure');
        figure.className = 'img';
        const scale = document.createElement('span');
        scale.className = 'scale';
        const img = document.createElement('img');
        img.loading = 'lazy';
        img.src = m.cover;
        img.alt = m.title;
        scale.appendChild(img);
        figure.appendChild(scale);
        slide.appendChild(figure);
        // 文字
        const txts = document.createElement('div');
        txts.className = 'txts';
        const sSpan = document.createElement('span');
        sSpan.textContent = m.issue;
        const sP = document.createElement('p');
        sP.textContent = m.title;
        txts.appendChild(sSpan);
        txts.appendChild(sP);
        slide.appendChild(txts);
        wrapper.appendChild(slide);
      });

      // 末尾 MORE 按钮（返回杂志陈列页）
      const more = document.createElement('a');
      more.className = 'swiper-slide more-slide';
      more.href = 'magazine.html';
      const inSpan = document.createElement('span');
      inSpan.className = 'in';
      const moreDiv = document.createElement('div');
      moreDiv.className = 'more';
      const moreSpan = document.createElement('span');
      moreSpan.textContent = 'MORE';
      const moreP = document.createElement('p');
      moreDiv.appendChild(moreSpan);
      moreDiv.appendChild(moreP);
      inSpan.appendChild(moreDiv);
      more.appendChild(inSpan);
      wrapper.appendChild(more);
    }
  })();

  /* 纯原生拖拽滑动 + 吸附动画（简洁版 · transform 平移） */
  document.querySelectorAll('.swiper-container').forEach(container => {
    const wrapper = container.querySelector('.swiper-wrapper');
    const slides = Array.from(wrapper.children);
    let isDown = false, startX = 0, currentX = 0, prevX = 0, index = 0, moved = false;

    const getX = e => e.clientX || (e.touches && e.touches[0].clientX);
    /* offsetWidth 已含 padding（box-sizing:border-box），slide 间紧贴，故直接用 offsetWidth */
    const slideW = () => slides[0].offsetWidth;

    const setTransform = () => {
      wrapper.style.transform = `translateX(${currentX}px)`;
    };

    /* 初始定位到当前杂志（.is-current） */
    const currentIdx = slides.findIndex(s => s.classList.contains('is-current'));
    if(currentIdx > 0){
      index = currentIdx;
      currentX = -index * slideW();
      wrapper.style.transition = 'none';
      setTransform();
      wrapper.offsetWidth;  /* 强制重排，确保 transition:none 生效 */
      wrapper.style.transition = '';
    }

    const onDown = e => {
      isDown = true;
      moved = false;
      startX = getX(e);
      prevX = currentX;
      wrapper.style.transition = 'none';
      /* 鼠标事件阻止默认行为，避免浏览器触发原生图片「幽灵拖拽」 */
      if(e.type === 'mousedown'){ e.preventDefault(); }
    };

    const onMove = e => {
      if(!isDown) return;
      const x = getX(e);
      const delta = x - startX;
      if(Math.abs(delta) > 5) moved = true;  /* 位移超过 5px 视为拖拽 */
      currentX = prevX + delta;
      /* 边界约束：不允许拖出第一张之前或最后一张之后，避免露出空白 */
      const min = -((slides.length - 1) * slideW());
      const max = 0;
      if(currentX > max) currentX = max;
      if(currentX < min) currentX = min;
      setTransform();
      /* 鼠标拖拽中阻止文字/图片选中；touchmove 为 passive 不拦截 */
      if(e.type === 'mousemove'){ e.preventDefault(); }
    };

    const onUp = () => {
      if(!isDown) return;
      isDown = false;
      wrapper.style.transition = '';
      /* 拖到哪里就在哪里停止，不做吸附对齐 */
    };

    /* 拖拽位移超过 5px 时拦截 click，防止松手误跳转链接 */
    container.addEventListener('click', e => {
      if(moved){
        e.preventDefault();
        e.stopPropagation();
      }
    }, true);

    container.addEventListener('mousedown', onDown);
    container.addEventListener('mousemove', onMove);
    container.addEventListener('mouseup', onUp);
    container.addEventListener('mouseleave', onUp);
    container.addEventListener('touchstart', onDown, {passive: true});
    container.addEventListener('touchmove', onMove, {passive: true});
    container.addEventListener('touchend', onUp);
  });

  /* ===== 全屏杂志内页阅读器（OPEN PAGES 触发 · 单页左右翻阅） ===== */
  /* 一次显示一整张内页图（object-fit:contain 不裁切），左右热区/箭头/滑动/键盘翻页；
     翻页为左右滑入滑出，无翻书合成；到头时对应方向热区淡化禁用。 */
  (function(){
    const modal = document.getElementById('modalGallery');
    if(!modal) return;

    const closeBtn = modal.querySelector('.mg-close');
    const prevZone = modal.querySelector('.mg-prev');
    const nextZone = modal.querySelector('.mg-next');
    const count = modal.querySelector('.mg-count');
    const reader = modal.querySelector('.mg-reader');
    const pagesBox = modal.querySelector('.mg-pages');
    const cursor = modal.querySelector('.mg-cursor');

    let gallery = [];
    let pages = [];           /* 注入的 img 元素 */
    let currentIdx = 0;
    let isAnimating = false;
    let closingTimer = null;  /* 关闭离场动画计时器（淡出完成后再真正隐藏） */
    const CLOSE_MS = 400;     /* 离场时长（与 CSS .is-closing 过渡一致） */
    let pageRatio = 470/301;  /* 单页宽高比（横向大图 ≈1.56，首图加载后按实测值校正） */
    const FLIP_MS = 560;      /* 翻页动画时长（与 CSS transition 一致） */
    const isDesktop = () => window.innerWidth >= 768;

    /* ---------- 跟随鼠标的圆形翻页组件 ---------- */
    let curX = 0, curY = 0, tgtX = 0, tgtY = 0, cursorRAF = null, cursorDir = null;
    function cursorLoop(){
      curX += (tgtX - curX) * 0.18;
      curY += (tgtY - curY) * 0.18;
      cursor.style.transform = `translate3d(${curX}px,${curY}px,0) translate(-50%,-50%)`;
      cursorRAF = requestAnimationFrame(cursorLoop);
    }
    /* dir: 'prev' | 'next' | null —— 仅在左右翻页区浮现圆环；中间区域/到头隐藏 */
    function setCursor(dir){
      cursorDir = dir;
      const onPrev = dir === 'prev';
      const onNext = dir === 'next';
      const blocked = (onPrev && currentIdx === 0) || (onNext && currentIdx === gallery.length - 1);
      cursor.classList.toggle('is-prev', onPrev);
      cursor.classList.toggle('is-next', onNext);
      cursor.classList.toggle('is-show', !blocked && (onPrev || onNext));
    }
    function hideCursor(){
      cursorDir = null;
      cursor.classList.remove('is-prev','is-next','is-show');
    }
    /* 点击翻页时的樱花粉闪现反馈（圆环平时透明底，仅此刻填充） */
    function tapCursor(){
      if(!isDesktop()) return;
      cursor.classList.remove('is-tap');
      void cursor.offsetWidth;  /* 强制重绘，连点也能重新触发动画 */
      cursor.classList.add('is-tap');
      setTimeout(() => cursor.classList.remove('is-tap'), 340);
    }
    /* 圆环跟随鼠标；仅进入左右各 22% 翻页区时浮现并显示方向箭头；
       悬停右上角关闭按钮时隐藏圆环，避免两个图标重叠、干扰点击关闭 */
    modal.addEventListener('mousemove', e => {
      if(!isDesktop()) return;
      tgtX = e.clientX; tgtY = e.clientY;
      if(e.target.closest('.mg-close')){ hideCursor(); return; }
      const rel = e.clientX / window.innerWidth;
      if(rel < 0.22) setCursor('prev');
      else if(rel > 0.78) setCursor('next');
      else setCursor(null);
    }, { passive: true });
    /* 按下即判定区域翻页并闪现粉色圆形（点关闭按钮除外）：
       左 22% → 上一页，右 22% → 下一页，中间不翻页 */
    modal.addEventListener('mousedown', e => {
      if(!isDesktop()) return;
      if(e.target.closest('.mg-close')) return;
      const rel = e.clientX / window.innerWidth;
      if(rel < 0.22){
        if(currentIdx > 0){ tapCursor(); prev(); }
      } else if(rel > 0.78){
        if(currentIdx < gallery.length - 1){ tapCursor(); next(); }
      }
    });
    modal.addEventListener('mouseleave', hideCursor);

    /* 生成内页图片路径数组（6 张本地内页图，按杂志 id 索引） */
    function generateGallery(id){
      return Array.from({length:6}, (_,i) => `images/magazine/${id}/pages/${String(i+1).padStart(2,'0')}.webp`);
    }

    /* 按整屏视口计算舞台尺寸（全屏浏览，contain 整图不裁切） */
    function calcSize(){
      const maxW = window.innerWidth;
      const maxH = window.innerHeight;
      let w, h;
      if(maxW / maxH > pageRatio){ h = maxH; w = h * pageRatio; }
      else { w = maxW; h = w / pageRatio; }
      return { w: Math.round(w), h: Math.round(h) };
    }
    function updateFrame(){
      const { w, h } = calcSize();
      reader.style.width = w + 'px';
      reader.style.height = h + 'px';
    }

    /* 刷新所有页面的位置类：当前页居中，之前页置于左侧，之后页置于右侧（默认态） */
    function render(){
      pages.forEach((im, j) => {
        im.classList.toggle('is-cur', j === currentIdx);
        im.classList.toggle('is-left', j < currentIdx);
      });
      count.textContent = `${currentIdx + 1} / ${gallery.length}`;
      modal.classList.toggle('is-at-start', currentIdx === 0);
      modal.classList.toggle('is-at-end', currentIdx === gallery.length - 1);
      setCursor(cursorDir);  /* 翻页后按新页码重算圆形方向（到头自动隐藏） */
    }

    function goTo(i){
      if(isAnimating) return;
      i = Math.max(0, Math.min(gallery.length - 1, i));
      if(i === currentIdx) return;
      isAnimating = true;
      currentIdx = i;
      render();
      setTimeout(() => { isAnimating = false; }, FLIP_MS);
    }
    const next = () => goTo(currentIdx + 1);
    const prev = () => goTo(currentIdx - 1);

    /* 打开模态框：注入 6 张内页，回到第一页 */
    function openModal(id){
      /* 若上一场关闭动画仍在进行，先复位离场态 */
      clearTimeout(closingTimer);
      modal.classList.remove('is-closing');
      gallery = generateGallery(id);
      pagesBox.innerHTML = '';
      pages = gallery.map((src, i) => {
        const im = new Image();
        im.src = src;
        im.alt = `内页 ${i + 1}`;
        if(i === 0){
          im.onload = () => {
            if(im.naturalWidth){
              const r = im.naturalWidth / im.naturalHeight;
              if(Math.abs(r - pageRatio) > 0.01){ pageRatio = r; updateFrame(); }
            }
          };
        }
        pagesBox.appendChild(im);
        return im;
      });
      currentIdx = 0;
      cursorDir = null;
      modal.classList.add('is-open');
      modal.setAttribute('aria-hidden', 'false');
      lockBodyScroll();
      updateFrame();
      /* 桌面端启动圆形组件的鼠标跟随循环 */
      if(isDesktop() && cursorRAF === null){
        curX = tgtX = window.innerWidth / 2; curY = tgtY = window.innerHeight / 2;
        cursorRAF = requestAnimationFrame(cursorLoop);
      }
      /* 延迟 200ms（等模态框淡入）后显示第一页 */
      setTimeout(render, 200);
    }

    /* 关闭模态框：先切 .is-closing 播放离场动画（整层淡出 + 大图回缩 + 关闭钮旋转缩小），
       动画结束后再真正隐藏，避免 display:none 瞬间切断过渡造成生硬消失 */
    function closeModal(){
      if(!modal.classList.contains('is-open')) return;
      modal.classList.remove('is-open');
      modal.classList.add('is-closing');
      modal.setAttribute('aria-hidden', 'true');
      hideCursor();
      if(cursorRAF !== null){ cancelAnimationFrame(cursorRAF); cursorRAF = null; }
      clearTimeout(closingTimer);
      closingTimer = setTimeout(() => {
        modal.classList.remove('is-closing');
        unlockBodyScroll();  /* 淡出完成后再解锁背景滚动（锁定时已补偿滚动条宽度，解锁无重排闪烁） */
        closingTimer = null;
      }, CLOSE_MS);
    }

    /* 事件绑定：左右边缘 22% 隐形热区点击翻页（.mg-prev/.mg-next），中间区域不翻页 */
    closeBtn.addEventListener('click', closeModal);
    nextZone.addEventListener('click', next);
    prevZone.addEventListener('click', prev);

    /* 键盘控制：← → 翻页，ESC 关闭 */
    document.addEventListener('keydown', e => {
      if(!modal.classList.contains('is-open')) return;
      if(e.key === 'Escape') closeModal();
      if(e.key === 'ArrowLeft') prev();
      if(e.key === 'ArrowRight') next();
    });

    /* 窗口调整：重新计算舞台尺寸 */
    window.addEventListener('resize', () => {
      if(modal.classList.contains('is-open')) updateFrame();
    });

    /* 触摸滑动手势（阈值 50px）：右滑上一页，左滑下一页 */
    let touchStartX = 0;
    modal.addEventListener('touchstart', e => { touchStartX = e.touches[0].clientX; }, { passive: true });
    modal.addEventListener('touchend', e => {
      const delta = e.changedTouches[0].clientX - touchStartX;
      if(Math.abs(delta) > 50){ if(delta > 0) prev(); else next(); }
    }, { passive: true });

    /* 拦截「翻阅内页」按钮点击 → 打开阅读器 */
    const lookInsideBtn = document.querySelector('[data-field="lookInside"]');
    if(lookInsideBtn){
      lookInsideBtn.addEventListener('click', e => {
        e.preventDefault();
        const params = new URLSearchParams(location.search);
        const id = params.get('id') || '001';
        openModal(id);
      });
    }
  })();
</script>
</body>
</html>
