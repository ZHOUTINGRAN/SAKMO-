<!-- =============================================================
   Them magazine — Header HTML Template
   复制 <header> 块到你的页面 <body> 内部最前面
   依赖：components.css, logo.svg
   ============================================================= -->

<header id="h" class="them-header-wrap">
  <h1 class="logo">
    <span>Them magazine</span>
    <a href="/" aria-label="Them magazine home">
      <!-- 使用外部 SVG 文件：
           <img src="logo.svg" alt="Them magazine" style="width:100%;height:100%;fill:#fff;">
           或直接内联 SVG（见下方） -->
      <svg viewBox="0 0 77 32" xmlns="http://www.w3.org/2000/svg">
        <use href="logo.svg#logo" xlink:href="logo.svg#logo"/>
      </svg>
    </a>
  </h1>
  <button id="btn-m" class="u" role="button" tabindex="0" aria-label="Toggle menu" aria-expanded="false">
    <!-- 汉堡图标（默认显示） -->
    <span class="open" aria-hidden="true">
      <i class="t">
        <em class="u-target1"></em>
        <em class="u-target2"></em>
      </i>
      <i class="b">
        <em class="u-target1"></em>
        <em class="u-target2"></em>
      </i>
    </span>
    <!-- 关闭图标（菜单打开时显示） -->
    <span class="close" aria-hidden="true">
      <i class="t">
        <em class="u-target1"></em>
        <em class="u-target2"></em>
      </i>
      <i class="b">
        <em class="u-target1"></em>
        <em class="u-target2"></em>
      </i>
    </span>
  </button>
</header>
