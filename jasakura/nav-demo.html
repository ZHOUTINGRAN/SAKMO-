<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Them magazine - 抽屉导航栏 Demo</title>
  <style>
    /* =========================================================
       基础样式 / Reset & Base
       ========================================================= */
    *, *::before, *::after { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0;
      font-family: "Times New Roman", "Yu Mincho", "Hiragino Mincho ProN", serif;
      color: #1c1a16;
      background-color: #fcfbf7;
      -webkit-font-smoothing: antialiased;
    }
    a { color: inherit; text-decoration: none; }
    svg { display: block; width: 100%; height: 100%; }

    /* =========================================================
       顶部 Header + 汉堡按钮
       ========================================================= */
    #h {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: 70px;
      background: rgba(252, 251, 247, 0.95);
      backdrop-filter: blur(8px);
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 25px;
      transform: translateX(0) translateY(0) translateZ(0);
      transition: transform 0.4s;
    }
    @media (min-width: 768px) {
      #h { height: 100px; padding: 0 4vw; }
    }
    .logo {
      font-weight: 600;
      font-size: 1.1rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    #btn-m {
      position: relative;
      width: 42px;
      height: 42px;
      border: none;
      background: transparent;
      cursor: pointer;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    @media (min-width: 768px) {
      #btn-m { width: 50px; height: 50px; }
    }
    #btn-m span {
      position: relative;
      display: block;
      width: 42px;
      height: 14px;
      transition: all 0.4s;
    }
    @media (min-width: 768px) {
      #btn-m span { width: 50px; height: 14px; }
    }
    #btn-m span .t,
    #btn-m span .b {
      width: 100%;
      height: 2px;
      position: absolute;
      left: 0;
      background-color: #1c1a16;
      overflow: hidden;
      transition: all 0.4s;
    }
    #btn-m span .t { top: 0; }
    #btn-m span .b { bottom: 0; }

    /* 汉堡 ↔ 关闭 图标切换（由 .is-menu-open 触发） */
    .is-menu-open #btn-m span { opacity: 0; }
    .is-menu-open #btn-m span.close { opacity: 1; }
    #btn-m span.close { position: absolute; inset: 0; }
    #btn-m span.close .t {
      transform: rotate(15deg);
      top: 6px;
    }
    #btn-m span.close .b {
      transform: rotate(-15deg);
      bottom: 6px;
    }

    /* 打开时 Logo 淡出 */
    .is-menu-open #h .logo { opacity: 0; }

    /* 打开时 body 锁滚动 */
    body.is-hidden { overflow: hidden; }

    /* =========================================================
       示例内容区（用来体现遮罩效果）
       ========================================================= */
    .hero {
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 100px 25px;
    }
    .hero h1 {
      font-size: clamp(2.4rem, 6vw, 5rem);
      font-weight: 400;
      letter-spacing: 0.08em;
      margin: 0 0 16px;
    }
    .hero p {
      font-size: 1rem;
      color: #7c6a55;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      margin: 0;
    }
    .hint {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 0.8rem;
      color: #999;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      z-index: 50;
      animation: pulse 2s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.4; }
      50% { opacity: 1; }
    }

    /* =========================================================
       抽屉导航栏（你选中的 .in 部分）
       ========================================================= */

    /* 遮罩层 */
    #menu {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 90;
      pointer-events: none;           /* 默认：不可点击 */
      opacity: 0;
      transition: opacity 0.4s;
    }

    /* 背景遮罩 */
    #menu .bg {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 0;
      background-color: rgba(0, 0, 0, 0);
      transition: background-color 0.4s;
      cursor: pointer;
    }

    /* 抽屉本体（白色面板，从右侧滑入） */
    #menu .in {
      width: 82vw;
      position: absolute;
      top: 0; right: 0;
      height: 100%;
      background-color: #ffffff;
      z-index: 1;
      overflow-y: scroll;
      padding-bottom: 60px;
      transform: translateX(100%) translateY(0) translateZ(0);   /* 初始：屏幕外 */
      transition: transform 0.4s cubic-bezier(0.2, 0.7, 0.2, 1);
    }
    @media (min-width: 768px) {
      #menu .in { width: 32vw; min-width: 380px; }
    }

    /* 抽屉内部 padding */
    #menu .in .box {
      padding: 110px 25px 0;
    }
    @media (min-width: 768px) {
      #menu .in .box { padding: 160px 4vw 0; }
    }

    /* 抽屉里的 Logo（可选） */
    #menu .in .logo {
      position: absolute;
      top: 25px;
      left: 20px;
      font-size: 0.9rem;
    }
    @media (min-width: 768px) {
      #menu .in .logo { left: calc(4vw - 10px); top: 32px; }
    }

    /* 搜索框 */
    #menu .in .box .search {
      width: 100%;
      position: relative;
      height: 32px;
      border-bottom: 1px solid #1c1a16;
      margin-bottom: 40px;
    }
    #menu .in .box .search input[type=text] {
      width: 100%;
      padding: 0;
      font-size: 1.5rem;
      border: none;
      outline: none;
      background: transparent;
      font-family: inherit;
      color: #1c1a16;
    }
    #menu .in .box .search input[type=text]::placeholder {
      color: #999;
      letter-spacing: 0.15em;
      font-size: 0.9rem;
    }
    #menu .in .box .search button {
      position: absolute;
      top: 0; right: 0;
      width: 50px;
      height: 32px;
      border: none;
      background: transparent;
      color: transparent;
      cursor: pointer;
    }
    #menu .in .box .search svg {
      width: 18px; height: 18px;
      pointer-events: none;
      z-index: 10;
      fill: #1c1a16;
      position: absolute;
      top: 0; right: 10px; bottom: 0;
      margin: auto;
    }

    /* 分组小标题 */
    #menu .in .box .t {
      font-size: 1rem;
      color: #999;
      margin: 32px 0 10px;
      letter-spacing: 0.1em;
      font-family: inherit;
    }
    @media (min-width: 768px) {
      #menu .in .box .t { margin-bottom: 8px; }
    }

    /* 菜单项容器 */
    #menu .in .box .cell {
      overflow: hidden;
      line-height: 1.3;
    }

    /* 菜单项本体：必须 overflow:hidden 来裁掉滑入的黑块 */
    #menu .in .box .u-menu {
      position: relative;
      font-size: 2rem;
      line-height: 1.3;
      display: inline-block;
      overflow: hidden;
      letter-spacing: 0.02em;
      font-weight: 500;
    }
    @media (min-width: 768px) {
      #menu .in .box .u-menu { font-size: 2.4rem; line-height: 1.2; }
    }

    /* 文字（z-index 高，被黑块盖住时看不见） */
    #menu .in .box .u-menu span {
      position: relative;
      z-index: 1;
      display: inline-block;
      padding-bottom: 2px;
      transition: color 0.25s ease;
    }
    @media (min-width: 768px) {
      #menu .in .box .u-menu.is-hover span { color: #fff; }
    }

    /* 黑色覆盖条：初始在右侧外 (-101%)，JS hover 时推到 0% 盖住文字 */
    #menu .in .box .u-menu .u-target {
      width: 100%;
      height: 100%;
      background-color: #000;
      position: absolute;
      top: 0; left: 0; bottom: 0;
      margin: auto;
      transform: translateX(-101%) translateY(0) translateZ(0);
      will-change: transform;
      pointer-events: none;
    }

    /* SNS 图标横排 */
    #menu .in .box .sns {
      margin: 28px 0;
      display: flex;
      align-items: center;
      gap: 20px;
    }
    @media (min-width: 768px) {
      #menu .in .box .sns { margin: 38px 0; }
    }
    #menu .in .box .sns a {
      width: 26px; height: 26px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    #menu .in .box .sns svg {
      width: 22px; height: 22px;
      fill: #1c1a16;
      transition: fill 0.25s ease;
    }
    #menu .in .box .sns a:hover svg { fill: #7c6a55; }

    /* 底部链接 */
    #menu .in .box .links {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 16px;
    }
    #menu .in .box .links a {
      font-size: 1.2rem;
      line-height: 1.3;
      color: #1c1a16;
      transition: color 0.2s ease;
    }
    #menu .in .box .links a:hover { color: #7c6a55; }

    /* =========================================================
       打开状态（由 JS 给 <html> 加 .is-menu-open 触发）
       ========================================================= */
    .is-menu-open #menu {
      opacity: 1;
      pointer-events: auto;
    }
    .is-menu-open #menu .in {
      transform: translateX(0) translateY(0%) translateZ(0);
    }
    .is-menu-open #menu .bg {
      background-color: rgba(0, 0, 0, 0.3);
    }
  </style>
  <link rel="icon" href="images/favicon.png" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" href="images/favicon.png">
</head>
<body>

  <!-- 顶部 Header -->
  <header id="h">
    <a href="/" class="logo">THEM magazine</a>
    <button id="btn-m" aria-label="Toggle menu">
      <span class="open"><span class="t"></span><span class="b"></span></span>
      <span class="close"><span class="t"></span><span class="b"></span></span>
    </button>
  </header>

  <!-- 示例内容区 -->
  <section class="hero">
    <div>
      <h1>影像之间</h1>
      <p>Hover the menu items to see the animation</p>
    </div>
  </section>
  <div class="hint">点击右上角按钮打开菜单 · Click the button to open the menu</div>

  <!-- =========================================================
       抽屉导航栏（你选中的组件）
       ========================================================= -->
  <div id="menu" role="dialog" aria-hidden="true">
    <!-- 背景遮罩（点击关闭） -->
    <div class="bg"></div>

    <!-- 抽屉本体 -->
    <div class="in">
      <a href="/" class="logo">THEM magazine</a>

      <div class="box">

        <!-- 搜索 -->
        <div class="search">
          <form id="searchform" onsubmit="return false;">
            <input type="text" name="s" placeholder="SEARCH">
            <button type="submit" aria-label="Search">検索する</button>
            <!-- 搜索图标 -->
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
            </svg>
          </form>
        </div>

        <!-- 栏目导航 -->
        <p class="t">CONTENTS</p>

        <div class="cell"><a href="#" class="u-menu"><span>FEATURE</span><i class="u-target"></i></a></div>
        <div class="cell"><a href="#" class="u-menu"><span>EDITORIAL</span><i class="u-target"></i></a></div>
        <div class="cell"><a href="#" class="u-menu"><span>FASHION</span><i class="u-target"></i></a></div>
        <div class="cell"><a href="#" class="u-menu"><span>CULTURE</span><i class="u-target"></i></a></div>
        <div class="cell"><a href="#" class="u-menu"><span>LIFESTYLE</span><i class="u-target"></i></a></div>
        <div class="cell"><a href="#" class="u-menu"><span>INTERVIEW</span><i class="u-target"></i></a></div>
        <div class="cell"><a href="#" class="u-menu"><span>EDITOR'S VOICE</span><i class="u-target"></i></a></div>
        <div class="cell"><a href="#" class="u-menu"><span>MAGAZINE</span><i class="u-target"></i></a></div>

        <!-- SNS -->
        <div class="sns">
          <a href="#" class="ig" aria-label="Instagram">
            <svg viewBox="0 0 24 24"><path d="M12 2.2c3.2 0 3.6 0 4.8.1 1.2.1 1.8.3 2.2.5.6.2 1 .5 1.4.9.4.4.7.9.9 1.4.2.4.4 1 .5 2.2.1 1.3.1 1.7.1 4.8s0 3.6-.1 4.8c-.1 1.2-.3 1.8-.5 2.2-.2.6-.5 1-.9 1.4-.4.4-.9.7-1.4.9-.4.2-1 .4-2.2.5-1.3.1-1.7.1-4.8.1s-3.6 0-4.8-.1c-1.2-.1-1.8-.3-2.2-.5-.6-.2-1-.5-1.4-.9-.4-.4-.7-.9-.9-1.4-.2-.4-.4-1-.5-2.2C2.2 15.6 2.2 15.2 2.2 12s0-3.6.1-4.8c.1-1.2.3-1.8.5-2.2.2-.6.5-1 .9-1.4.4-.4.9-.7 1.4-.9.4-.2 1-.4 2.2-.5C8.4 2.2 8.8 2.2 12 2.2zm0 3.3c-1.8 0-2 0-2.7.1-.7 0-1 .2-1.2.3-.3.1-.5.3-.7.5-.2.2-.4.4-.5.7-.1.3-.2.6-.3 1.2C6.5 7.9 6.5 8.2 6.5 10s0 2.1.1 2.8c0 .7.2 1 .3 1.2.1.3.3.5.5.7.2.2.4.4.7.5.3.1.6.2 1.2.3.7.1.9.1 2.8.1s2.1 0 2.8-.1c.7 0 1-.2 1.2-.3.3-.1.5-.3.7-.5.2-.2.4-.4.5-.7.1-.3.2-.6.3-1.2.1-.7.1-.9.1-2.8s0-2.1-.1-2.8c0-.7-.2-1-.3-1.2-.1-.3-.3-.5-.5-.7-.2-.2-.4-.4-.7-.5-.3-.1-.6-.2-1.2-.3C14.1 5.5 13.8 5.5 12 5.5zm0 2.3a3.2 3.2 0 110 6.4 3.2 3.2 0 010-6.4zm0 5.3a2.1 2.1 0 100-4.2 2.1 2.1 0 000 4.2zm3.4-5.6a.8.8 0 110 1.6.8.8 0 010-1.6z"/></svg>
          </a>
          <a href="#" class="fb" aria-label="Facebook">
            <svg viewBox="0 0 24 24"><path d="M22 12a10 10 0 10-11.6 9.9v-7H8v-3h2.4V9.7c0-2.4 1.4-3.7 3.6-3.7 1 0 2.1.2 2.1.2v2.3h-1.2c-1.2 0-1.6.8-1.6 1.6V12h2.7l-.4 3h-2.3v7A10 10 0 0022 12z"/></svg>
          </a>
          <a href="#" class="tw" aria-label="Twitter">
            <svg viewBox="0 0 24 24"><path d="M22 5.8c-.7.3-1.5.5-2.3.6a4 4 0 001.8-2.2 8 8 0 01-2.5 1 4 4 0 00-6.8 3.7A11.4 11.4 0 013 4.8a4 4 0 001.2 5.3 4 4 0 01-1.8-.5v.1a0 0 0 3.2 4 4 4 0 01-1.8.1 4 4 0 003.7 2.8A8 8 0 012 18a11.3 11.3 0 006.1 1.8c7.3 0 11.3-6 11.3-11.3v-.5A8 8 0 0022 5.8z"/></svg>
          </a>
        </div>

        <!-- 其他链接 -->
        <p class="t">OTHERS</p>
        <div class="links">
          <a href="#">ABOUT</a>
          <a href="#">広告掲載</a>
          <a href="#">プライバシーポリシー</a>
          <a href="#" target="_blank" rel="noopener">運営会社</a>
        </div>

      </div>
    </div>
  </div>

  <script>
    /* =========================================================
       1) 菜单开关 / Menu toggle
       点击 #btn-m 给 <html> 切换 .is-menu-open 类
       同时 body 加 .is-hidden 锁定滚动
       ========================================================= */
    const htmlEl = document.documentElement;
    const bodyEl = document.body;
    const btnMenu = document.getElementById('btn-m');
    const menuEl = document.getElementById('menu');
    const bgEl = menuEl.querySelector('.bg');

    function openMenu() {
      htmlEl.classList.add('is-menu-open');
      bodyEl.classList.add('is-hidden');
      menuEl.setAttribute('aria-hidden', 'false');
    }
    function closeMenu() {
      htmlEl.classList.remove('is-menu-open');
      bodyEl.classList.remove('is-hidden');
      menuEl.setAttribute('aria-hidden', 'true');
    }
    function toggleMenu() {
      if (htmlEl.classList.contains('is-menu-open')) {
        closeMenu();
      } else {
        openMenu();
      }
    }

    btnMenu.addEventListener('click', toggleMenu);
    bgEl.addEventListener('click', closeMenu);

    // ESC 键关闭
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && htmlEl.classList.contains('is-menu-open')) {
        closeMenu();
      }
    });

    /* =========================================================
       2) 菜单项 hover 黑块滑动动画
       原始项目用 TweenLite（GreenSock）实现
       这里用原生 CSS transform + transition 实现等价效果
       ========================================================= */
    const menuItems = document.querySelectorAll('#menu .u-menu');
    const isDesktop = window.matchMedia('(min-width: 768px)').matches &&
                      !('ontouchstart' in window);

    if (isDesktop) {
      menuItems.forEach(item => {
        const target = item.querySelector('.u-target');
        if (!target) return;

        // 进入：黑块从右侧滑入盖住文字
        item.addEventListener('mouseenter', () => {
          item.classList.add('is-hover');
          target.style.transition = 'none';
          // 强制回流，确保从 -101% 位置开始
          target.getBoundingClientRect();
          target.style.transition = 'transform 0.4s cubic-bezier(0.2, 0.7, 0.2, 1)';
          target.style.transform = 'translateX(0%)';
        });

        // 离开：黑块从左侧滑出
        item.addEventListener('mouseleave', () => {
          item.classList.remove('is-hover');
          target.style.transition = 'transform 0.4s cubic-bezier(0.2, 0.7, 0.2, 1)';
          target.style.transform = 'translateX(101%)';
        });
      });
    }

    /* =========================================================
       3) 窗口尺寸变化时重新判断桌面端
       ========================================================= */
    window.addEventListener('resize', () => {
      const desktopNow = window.matchMedia('(min-width: 768px)').matches &&
                         !('ontouchstart' in window);
      if (desktopNow && menuItems[0] && !menuItems[0].dataset.bound) {
        // 重新绑定（简单处理，实际项目可做得更严谨）
      }
    });
  </script>
</body>
</html>
