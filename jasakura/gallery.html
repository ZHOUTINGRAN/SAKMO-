<style>
  html, body { margin: 0; padding: 0; overflow: hidden; }
  canvas { display: block; }

  /* ===== 图片详情面板（与旧画廊 .photo-detail 同款 · scoped 不影响 WebGL 页面） ===== */
  .photo-detail{--paper:#fafaf8;--paper-2:#f2f2ef;--ink:#1a1a1a;--ink-soft:#5a5a5a;--muted:#9a9a9a;--line:#e6e6e3;--line-2:#d4d4d0;--sakura:#FF9AC1;--serif:"Cormorant Garamond","Noto Serif SC",Baskerville,"Songti SC",serif;--sans:"Inter","Noto Serif SC",-apple-system,"Helvetica Neue",Arial,sans-serif;--gut:4vw;
    position:fixed;top:0;left:0;width:100vw;height:100vh;background:var(--paper);z-index:100;display:none;overflow-y:auto}
  .photo-detail.is-open{display:block}
  @keyframes sakura-sweep{0%{background-position:0% center}100%{background-position:100% center}}
  .photo-detail *{box-sizing:border-box}
  .photo-detail .pd-logo{position:fixed;top:30px;left:36px;z-index:9}
  .photo-detail .pd-logo a{display:flex;align-items:baseline;gap:10px;line-height:1;color:inherit;text-decoration:none}
  .photo-detail .pd-logo .en{font-family:var(--serif);font-size:26px;font-weight:600;letter-spacing:.025em;color:var(--ink)}
  .photo-detail .pd-logo .ja{font-family:var(--sans);font-size:10.5px;font-weight:500;letter-spacing:.18em;color:var(--ink-soft)}
  @media(min-width:768px){
    .photo-detail .pd-logo a:hover .en,
    .photo-detail .pd-logo a:hover .ja{
      background:linear-gradient(90deg,var(--ink) 0%,var(--ink) 40%,var(--sakura) 47%,#FFF 50%,var(--sakura) 53%,var(--ink) 60%,var(--ink) 100%);
      background-size:250% auto;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;animation:sakura-sweep 1.5s linear infinite;
    }
    .photo-detail .pd-logo a:hover .ja{background:linear-gradient(90deg,var(--ink-soft) 0%,var(--ink-soft) 40%,var(--sakura) 47%,#FFF 50%,var(--sakura) 53%,var(--ink-soft) 60%,var(--ink-soft) 100%);background-size:250% auto;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;animation:sakura-sweep 1.5s linear infinite;}
  }
  .photo-detail .pd-close{position:fixed;top:36px;right:36px;z-index:10;width:56px;height:56px;background:transparent;border:0;padding:0;cursor:pointer;opacity:0;transform:scale(.82);transition:opacity .35s ease,transform .5s cubic-bezier(.34,1.45,.64,1)}
  .photo-detail.is-open .pd-close{opacity:1;transform:scale(1);transition-delay:.22s}
  .photo-detail.is-open:not(.is-in):not(.is-switching) .pd-close{opacity:0;transform:scale(.82);transition-delay:0s}
  .photo-detail .pd-close i{position:absolute;top:50%;left:50%;width:50px;height:2px;background:var(--ink);transition:transform .4s cubic-bezier(.2,.7,.2,1),background .3s ease}
  .photo-detail .pd-close i.t{transform:translate(-50%,-50%) rotate(15deg)}
  .photo-detail .pd-close i.b{transform:translate(-50%,-50%) rotate(-15deg)}
  @media(min-width:769px){
    .photo-detail .pd-close:hover i{background:var(--sakura)}
    .photo-detail .pd-close:hover i.t{transform:translate(-50%,-50%) rotate(20deg)}
    .photo-detail .pd-close:hover i.b{transform:translate(-50%,-50%) rotate(-20deg)}
  }
  /* ===== 图片详情：以照片为绝对主角，图注仅保留编号/标题/作者 ===== */
  .photo-detail .pd-inner{position:relative;max-width:1500px;margin:0 auto;padding:104px var(--gut) 120px;display:flex;align-items:center;justify-content:center;min-height:100vh;z-index:2}
  .photo-detail .pd-figure{display:flex;flex-direction:column;align-items:center;gap:30px;width:100%;max-width:1080px;margin:0 auto}
  .photo-detail .pd-img,.photo-detail .pd-cap{opacity:0;transform:translateY(24px);transition:opacity .6s cubic-bezier(.2,.7,.2,1),transform .6s cubic-bezier(.2,.7,.2,1)}
  .photo-detail.is-in .pd-img{opacity:1;transform:translateY(0)}
  .photo-detail.is-in .pd-cap{opacity:1;transform:translateY(0);transition-delay:.14s}
  .photo-detail.is-switching .pd-img,.photo-detail.is-switching .pd-cap{transition:opacity .32s cubic-bezier(.4,0,.2,1),transform .32s cubic-bezier(.4,0,.2,1);opacity:0;transform:translateY(14px) scale(.985)}
  .photo-detail.is-switching .pd-img img{transition:transform .32s cubic-bezier(.4,0,.2,1);transform:scale(1.01)}
  .photo-detail .pd-img{width:100%;max-width:100%;display:flex;align-items:center;justify-content:center}
  .photo-detail .pd-img img{display:block;max-width:100%;max-height:calc(100vh - 300px);width:auto;height:auto;transform:scale(1.03);transition:transform 1s cubic-bezier(.2,.7,.2,1);object-fit:contain}
  .photo-detail.is-in .pd-img img{transform:scale(1)}
  .photo-detail .pd-img.is-portrait img{max-height:calc(100vh - 320px);max-width:min(100%,480px)}
  .photo-detail .pd-img.is-square img{max-height:calc(100vh - 300px);max-width:min(100%,620px)}
  /* 图注：馆藏铭牌式居中排版——细轨饰线 · 馆藏编号 · 英文大斜题 · 中文疏排 · 作者署名 */
  .photo-detail .pd-cap{width:100%;max-width:560px;margin:0 auto;display:flex;flex-direction:column;align-items:center;text-align:center}
  /* 顶部饰轨：两条细线夹一枚樱花粉菱标 */
  .photo-detail .pd-cap-rail{display:flex;align-items:center;justify-content:center;gap:14px;width:200px;max-width:60vw}
  .photo-detail .pd-cap-rail::before,.photo-detail .pd-cap-rail::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--line-2))}
  .photo-detail .pd-cap-rail::after{background:linear-gradient(90deg,var(--line-2),transparent)}
  .photo-detail .pd-cap-rail i{flex:none;width:6px;height:6px;background:var(--sakura);transform:rotate(45deg);box-shadow:0 0 0 3px var(--paper),0 0 0 3.5px rgba(255,154,193,.28)}
  /* 馆藏编号 */
  .photo-detail .pd-plate{margin-top:16px;font-family:var(--sans);font-size:9.5px;font-weight:500;letter-spacing:.34em;text-transform:uppercase;color:var(--muted)}
  .photo-detail .pd-plate em{font-family:var(--serif);font-style:italic;font-size:12px;letter-spacing:.08em;text-transform:none;color:var(--ink-soft);margin-left:8px}
  .photo-detail .pd-plate em b{font-style:normal;font-weight:400;color:var(--line-2);margin-right:6px}
  /* 英文主标题：Playfair Display 高对比斜体，时尚画册式的戏剧感 */
  .photo-detail .pd-title-en{margin:13px 0 0;font-family:"Playfair Display","Cormorant Garamond","Noto Serif SC",Baskerville,serif;font-style:italic;font-weight:400;font-size:clamp(30px,4.2vw,42px);line-height:1.12;letter-spacing:.008em;color:var(--ink);-webkit-font-smoothing:antialiased;text-rendering:geometricPrecision}
  /* 中文副标题：大字距疏排，沉为注释层 */
  .photo-detail .pd-title-zh{margin-top:11px;font-family:var(--serif);font-weight:400;font-size:14px;letter-spacing:.42em;text-indent:.42em;color:var(--ink-soft)}
  /* 作者署名 */
  .photo-detail .pd-by{display:flex;flex-direction:column;align-items:center;gap:5px;margin-top:24px}
  .photo-detail .pd-by-l{font-family:var(--sans);font-size:8.5px;font-weight:500;letter-spacing:.36em;text-transform:uppercase;color:var(--muted)}
  .photo-detail .pd-by-n{font-family:var(--serif);font-weight:600;font-size:16px;letter-spacing:.14em;color:var(--ink)}
  .photo-detail .pd-by-n::before,.photo-detail .pd-by-n::after{content:"";display:inline-block;width:14px;height:1px;background:var(--line-2);vertical-align:middle;margin:0 12px 3px}
  .photo-detail .pd-pagenation{position:fixed;bottom:0;left:0;right:0;height:72px;display:flex;align-items:center;justify-content:center;background:var(--paper);border-top:1px solid var(--line);z-index:5;opacity:0;transform:translateY(100%);transition:opacity .5s ease .2s,transform .5s cubic-bezier(.2,.7,.2,1) .2s}
  .photo-detail.is-in .pd-pagenation{opacity:1;transform:translateY(0)}
  .photo-detail .pd-pagenation .prev,.photo-detail .pd-pagenation .next{position:absolute;top:50%;transform:translateY(-50%);display:inline-block;padding-bottom:7px;color:var(--ink);cursor:pointer;text-decoration:none;transition:transform .35s cubic-bezier(.2,.7,.2,1);background:none;border:0}
  .photo-detail .pd-pagenation .prev{left:4vw}.photo-detail .pd-pagenation .next{right:4vw}
  .photo-detail .pd-pagenation .prev span,.photo-detail .pd-pagenation .next span{font-family:var(--serif);font-size:16px;line-height:1;position:relative;z-index:10;background:linear-gradient(90deg,var(--ink) 0%,var(--ink) 40%,var(--sakura) 47%,#FFF 50%,var(--sakura) 53%,var(--ink) 60%,var(--ink) 100%);background-size:250% auto;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;animation:sakura-sweep 1.5s linear infinite}
  @media(min-width:768px){.photo-detail .pd-pagenation .prev span,.photo-detail .pd-pagenation .next span{font-size:22px}}
  .photo-detail .pd-pagenation .prev::after,.photo-detail .pd-pagenation .next::after{content:"";position:absolute;z-index:0;bottom:0;left:50%;width:0;height:1px;background:var(--ink);transition:width .4s cubic-bezier(.2,.7,.2,1),left .4s cubic-bezier(.2,.7,.2,1),background .3s}
  @media(min-width:768px){
    .photo-detail .pd-pagenation .prev:hover,.photo-detail .pd-pagenation .next:hover{transform:translateY(-50%) scale(1.06)}
    .photo-detail .pd-pagenation .prev:hover::after,.photo-detail .pd-pagenation .next:hover::after{width:100%;left:0;background:var(--sakura)}
  }
  .photo-detail .pd-pagenation .all{width:18px;height:18px;display:inline-block;position:relative;border:0;background:transparent;padding:0;cursor:pointer}
  @media(min-width:768px){.photo-detail .pd-pagenation .all{width:24px;height:24px}}
  .photo-detail .pd-pagenation .all svg{position:absolute;top:0;right:0;bottom:0;left:0;margin:auto;width:18px;height:18px;z-index:10;transition:transform .35s cubic-bezier(.2,.7,.2,1),opacity .3s ease;fill:var(--ink)}
  @media(min-width:768px){.photo-detail .pd-pagenation .all svg{width:24px;height:24px}}
  .photo-detail .pd-pagenation .all:hover svg{opacity:.4;transform:scale(1.12)}
  @media(max-width:768px){
    .photo-detail .pd-close{top:26px;right:26px;width:48px;height:48px}
    .photo-detail .pd-close i{width:42px}
    .photo-detail .pd-logo{top:24px;left:26px}
    .photo-detail .pd-logo .en{font-size:20px}
    .photo-detail .pd-logo .ja{font-size:9px}
    .photo-detail .pd-inner{padding:72px 25px 88px}
    .photo-detail .pd-figure{gap:18px}
    .photo-detail .pd-img img{max-height:calc(100vh - 400px)}
    .photo-detail .pd-img.is-portrait img{max-height:calc(100vh - 410px);max-width:min(100%,74vw)}
    .photo-detail .pd-img.is-square img{max-height:calc(100vh - 400px);max-width:min(100%,86vw)}
    .photo-detail .pd-plate{margin-top:13px;font-size:9px;letter-spacing:.3em}
    .photo-detail .pd-title-en{font-size:clamp(26px,8vw,33px)}
    .photo-detail .pd-title-zh{font-size:13px;letter-spacing:.3em;text-indent:.3em;margin-top:9px}
    .photo-detail .pd-by{margin-top:19px}
    .photo-detail .pd-pagenation{height:64px}
    .photo-detail .pd-pagenation .prev span,.photo-detail .pd-pagenation .next span{font-size:15px}
  }

  /* ===== 顶栏 #g-h（站点同款：difference 混合模式，白字随底色自动反色） ===== */
  #g-h,#g-menu{--serif:"Cormorant Garamond","Noto Serif SC",Baskerville,"Songti SC",serif;--sans:"Inter","Noto Serif SC",-apple-system,"Helvetica Neue",Arial,sans-serif;--ink:#1a1a1a;--ink-soft:#5a5a5a;--muted:#9a9a9a;--sakura:#FF9AC1;--logo-size:42px;--logo-ja-size:10px}
  @keyframes g-header-in{from{opacity:0;transform:translateY(-14px)}to{opacity:1;transform:translateY(0)}}
  #g-h{position:fixed;top:0;left:0;width:100%;height:88px;z-index:80;mix-blend-mode:difference;display:flex;align-items:flex-end;justify-content:space-between;padding:0 0 0 25px;transition:height .4s cubic-bezier(.2,.7,.2,1);animation:g-header-in .6s cubic-bezier(.2,.7,.2,1) both}
  @media(min-width:768px){#g-h{height:100px;padding-left:3.7vw;padding-right:calc(3.7vw - 25px)}}
  #g-h .logo{position:relative;align-self:flex-start;padding-top:14px;transition:all .4s cubic-bezier(.2,.7,.2,1)}
  @media(min-width:768px){#g-h .logo{padding-top:22px}}
  #g-h .logo a{display:flex;align-items:baseline;gap:12px;line-height:1;color:#fff;transition:opacity .4s ease}
  #g-h .logo .en{font-family:var(--serif);font-size:var(--logo-size);font-weight:600;letter-spacing:.025em;font-feature-settings:"liga" 1,"dlig" 1;color:#fff;transition:font-size .4s cubic-bezier(.2,.7,.2,1),color .4s ease}
  #g-h .logo .ja{font-family:var(--sans);font-size:var(--logo-ja-size);font-weight:500;letter-spacing:.18em;color:rgba(255,255,255,.7);transition:font-size .4s cubic-bezier(.2,.7,.2,1),color .4s ease}
  /* Header logo：hover 时切换混合模式 + 樱花粉灯带流光（主站同款 :has 方案） */
  @media(min-width:768px){
    #g-h:has(.logo a:hover){mix-blend-mode:normal}
    #g-h:has(.logo a:hover) .logo .en{--base:var(--ink)}
    #g-h:has(.logo a:hover) .logo .ja{--base:var(--ink-soft)}
    #g-h:has(.logo a:hover) .logo .en,
    #g-h:has(.logo a:hover) .logo .ja{
      background:linear-gradient(90deg,var(--base) 0%,var(--base) 40%,var(--sakura) 47%,#FFF 50%,var(--sakura) 53%,var(--base) 60%,var(--base) 100%);
      background-size:250% auto;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
      animation:sakura-sweep 1.5s linear infinite;
    }
    /* 混合模式切换后菜单按钮改为墨色保持可见 */
    #g-h:has(.logo a:hover) #g-menu-btn span .t,
    #g-h:has(.logo a:hover) #g-menu-btn span .b{background:var(--ink)}
  }
  #g-menu-btn{position:relative;width:92px;height:68px;flex:none;background:transparent;border:0;padding:0;cursor:pointer;transition:all .4s cubic-bezier(.2,.7,.2,1);z-index:10}
  @media(min-width:768px){#g-menu-btn{width:100px;height:80px}}
  #g-menu-btn span{width:42px;height:14px;position:absolute;top:0;right:0;bottom:0;left:0;margin:auto;transition:opacity .4s ease}
  @media(min-width:768px){#g-menu-btn span{width:50px}}
  #g-menu-btn>span{opacity:1}
  #g-menu-btn>span.close{opacity:0}
  #g-menu-btn span .t,#g-menu-btn span .b{width:100%;height:2px;position:absolute;right:0;background:#fff;transition:width .35s cubic-bezier(.2,.7,.2,1),transform .4s cubic-bezier(.2,.7,.2,1),background .3s ease}
  #g-menu-btn span .t{top:0}
  #g-menu-btn span .b{bottom:0}
  @media(min-width:768px){
    #g-menu-btn:hover span.open .t,#g-menu-btn.is-hover span.open .t{width:62%}
    #g-menu-btn:hover span.open .t,#g-menu-btn.is-hover span.open .t,#g-menu-btn:hover span.open .b,#g-menu-btn.is-hover span.open .b{background:var(--sakura)}
  }
  #g-menu-btn span.close .t{transform:rotate(15deg);top:5px}
  #g-menu-btn span.close .b{transform:rotate(-15deg);bottom:5px}
  @media(min-width:768px){#g-menu-btn span.close .t{top:6px}#g-menu-btn span.close .b{bottom:6px}}
  html.is-menu-open #g-menu-btn>span{opacity:0}
  html.is-menu-open #g-menu-btn>span.close{opacity:1}
  html.is-menu-open #g-h .logo a{opacity:0}

  /* ===== 抽屉导航 #g-menu（站点同款：右侧白面板 + 搜索 + 栏目 + SNS） ===== */
  #g-menu{position:fixed;top:0;left:0;width:100%;height:100%;z-index:70;pointer-events:none;opacity:0;transition:opacity .4s}
  #g-menu .bg{position:fixed;inset:0;z-index:0;background-color:rgba(0,0,0,0);transition:background-color .4s;cursor:pointer}
  #g-menu .in{width:82vw;position:absolute;top:0;right:0;height:100%;background:#fff;z-index:1;overflow-y:auto;padding-bottom:60px;transform:translateX(100%);transition:transform .45s cubic-bezier(.2,.7,.2,1);box-shadow:-24px 0 60px rgba(0,0,0,.1)}
  @media (min-width:768px){#g-menu .in{width:440px}}
  @media (max-width:767px){#g-menu .in{width:100vw}}
  #g-menu .in .drawer-logo{padding:45px 28px 0}
  @media (min-width:768px){#g-menu .in .drawer-logo{padding:50px 36px 0}}
  #g-menu .in .drawer-logo a{display:flex;align-items:baseline;gap:12px;line-height:1;color:var(--ink)}
  #g-menu .in .drawer-logo .en{font-family:var(--serif);font-size:19px;font-weight:600;letter-spacing:.025em;font-feature-settings:"liga" 1,"dlig" 1}
  @media (min-width:768px){#g-menu .in .drawer-logo .en{font-size:22px}}
  #g-menu .in .drawer-logo .ja{font-family:var(--sans);font-size:9.2px;font-weight:500;letter-spacing:.18em;color:var(--muted)}
  #g-menu .in .box{padding:40px 28px 0}
  @media (min-width:768px){#g-menu .in .box{padding:48px 36px 0}}
  #g-menu .search{width:100%;position:relative;height:36px;border-bottom:1px solid var(--ink);margin-bottom:52px}
  #g-menu .search input{width:100%;padding:0;font-family:var(--serif);font-size:15px;border:0;outline:0;background:transparent;color:var(--ink)}
  #g-menu .search input::placeholder{color:var(--muted);letter-spacing:.18em;font-size:10px;font-family:var(--sans)}
  #g-menu .search button{position:absolute;top:0;right:0;width:40px;height:36px;border:0;background:transparent;color:transparent;cursor:pointer}
  #g-menu .search svg{width:18px;height:18px;pointer-events:none;position:absolute;top:0;right:8px;bottom:0;margin:auto;fill:var(--ink)}
  #g-menu .t-label{font-family:var(--sans);font-size:10px;color:var(--muted);margin:0 0 20px;letter-spacing:.22em;text-transform:uppercase}
  #g-menu .t-label:not(:first-child){margin-top:52px}
  #g-menu .cell{line-height:1.4;margin-bottom:6px}
  #g-menu .u-menu{position:relative;font-family:var(--serif);font-size:20px;line-height:1.4;display:inline-flex;align-items:baseline;column-gap:14px;letter-spacing:.03em;font-weight:500;color:var(--ink)}
  @media (min-width:768px){#g-menu .u-menu{font-size:25px;line-height:1.4}}
  #g-menu .u-menu span{position:relative;z-index:1;display:inline-block;transition:color .3s ease,letter-spacing .45s cubic-bezier(.2,.7,.2,1),transform .45s cubic-bezier(.2,.7,.2,1)}
  #g-menu .u-menu .en{padding-bottom:3px;letter-spacing:.03em}
  #g-menu .u-menu .en::before{content:"";position:absolute;left:-18px;top:.22em;width:8px;height:8px;background:var(--sakura);transform:rotate(45deg) scale(0);opacity:0;transition:transform .5s cubic-bezier(.34,1.56,.64,1),opacity .3s ease}
  @media (min-width:768px){
    #g-menu .u-menu:hover .en::before,#g-menu .u-menu.is-hover .en::before{transform:rotate(45deg) scale(1);opacity:1}
    #g-menu .u-menu:hover .en,#g-menu .u-menu.is-hover .en{letter-spacing:.09em;transform:translateX(8px)}
    #g-menu .u-menu:hover .ja,#g-menu .u-menu.is-hover .ja{transform:translateX(8px) translateY(-2px);color:var(--ink)}
  }
  #g-menu .u-menu .ja{font-family:var(--sans);font-size:10px;font-weight:400;color:var(--muted);letter-spacing:.1em;padding-bottom:0}

<script src="js/gallery-show.js"></script>
<script>
/* ============================================================
   WebGL 画廊项目数据 — 来自 images/gallery-show/ 展示合集
   · 清单：js/gallery-show.js（文件名数组，编号 = 你想要的顺序）
   · 文件命名：编号-分类-原文件名.webp（元信息自动继承 gallery-data.js）
   · 编排：横/竖幅均匀穿插（少数朝向等间距铺满全程，各池内按编号升序）
   · 纹理三级回退：-1280 → -640 → 原图副本
   · 文字索引（两端双列虚拟窗口）与 WebGL 平面共用同一份数据
   ============================================================ */
(function(){
  var files = (window.galleryShowFiles || []).slice();
  if (!files.length) return;
  var items = (window.galleryItems || []).concat(window.galleryPhotosExtra || []);
  var byImg = {};
  items.forEach(function(p){ byImg[p.img] = p; });

  function isPortraitRatio(r){ return r === 'ar-23' || r === 'ar-34'; }

  /* 解析清单文件名：编号-分类-原文件名.扩展名 */
  function parseFile(f){
    var m = f.match(/^(\d+)-([^.]+)\.([a-z0-9]+)$/i);
    return m ? { num: parseInt(m[1], 10), key: m[2], ext: m[3].toLowerCase() } : null;
  }
  /* key（分类-原文件名）→ gallery-data.js 元信息（标题/摄影师/参数等） */
  function metaFor(key){
    var i = key.indexOf('-');
    if (i < 0) return null;
    var cat = key.slice(0, i), name = key.slice(i + 1);
    var exts = ['webp', 'jpg', 'jpeg', 'png'];
    for (var e = 0; e < exts.length; e++){
      var rec = byImg['images/gallery/' + cat + '/' + name + '.' + exts[e]];
      if (rec) return rec;
    }
    return null;
  }

  /* 全部清单条目按横/竖分池，池内按编号升序（= 用户指定顺序） */
  var pool = { landscape: [], portrait: [] };
  files.forEach(function(f){
    var pf = parseFile(f);
    if (!pf) return;
    var meta = metaFor(pf.key) || {};
    var entry = {
      num: pf.num,
      ext: pf.ext,
      base: 'images/gallery-show/' + f.replace(/\.[^.]+$/, ''),
      orig: meta.img || '',
      titleEn: meta.titleEn || meta.title || ('No.' + pf.num),
      titleZh: meta.title || '',
      photographer: meta.photographer || '',
      imgAlt: meta.imgAlt || meta.title || '',
      cat: meta.cat || '',
      catLabel: meta.catLabel || '',
      date: meta.date || '',
      role: meta.role || '',
      params: meta.params || '',
      ratio: meta.ratio || 'ar-34'
    };
    (isPortraitRatio(entry.ratio) ? pool.portrait : pool.landscape).push(entry);
  });
  pool.landscape.sort(function(a, b){ return a.num - b.num; });
  pool.portrait.sort(function(a, b){ return a.num - b.num; });

  /* 均匀穿插编排：数量少的朝向按等间距铺满全程，
     避免"严格交替一侧取尽后尾部连排"；池内仍按编号升序。
     相等时以横幅起头，横竖严格交替。 */
  var base, spice;
  if (pool.landscape.length >= pool.portrait.length){
    base = pool.landscape; spice = pool.portrait;
  } else {
    base = pool.portrait; spice = pool.landscape;
  }
  var total = base.length + spice.length;
  var spiceSlots = {};
  for (var k = 0; k < spice.length; k++){
    spiceSlots[Math.round((k + 0.5) * total / spice.length)] = true;
  }
  var ordered = [], bi = 0, si = 0;
  for (var slot = 0; slot < total; slot++){
    if (spiceSlots[slot] && si < spice.length) ordered.push(spice[si++]);
    else ordered.push(base[bi++]);
  }

  function toProject(p, idx){
    return {
      title: p.titleEn,
      titleZh: p.titleZh,
      photographer: p.photographer,
      slug: 'show-' + p.num,
      format: isPortraitRatio(p.ratio) ? 'portrait' : 'landscape',
      ratio: p.ratio,
      src: p.base + '-1280.webp',
      fallback: p.base + '-640.webp',
      original: p.base + '.' + p.ext,
      /* 详情面板大图 + 手记 JSON 走原分类文件夹路径 */
      img: p.orig,
      imgAlt: p.imgAlt,
      cat: p.cat,
      catLabel: p.catLabel,
      date: p.date,
      role: p.role,
      params: p.params
    };
  }

  /* 预检三级回退：-1280 → -640 → 原图副本；全部失败跳过（该图不展示） */
  function preflight(pr){
    return new Promise(function(resolve){
      var t1 = new Image();
      t1.onload = function(){ resolve(pr); };
      t1.onerror = function(){
        var t2 = new Image();
        t2.onload = function(){ pr.src = pr.fallback; resolve(pr); };
        t2.onerror = function(){
          var t3 = new Image();
          t3.onload = function(){ pr.src = pr.original; resolve(pr); };
          t3.onerror = function(){ resolve(null); };
          t3.src = pr.original;
        };
        t2.src = pr.fallback;
      };
      t1.src = pr.src;
    });
  }

  /* ---- 文字索引：两端双列虚拟窗口（12 槽位随滚动刷新） ----
     左列(上→下)= n-6..n-1（已过作品） · 右列(上→下)= n..n+5（当前与后续）
     n = 当前居中照片相对初始位置的循环偏移（gallery.js 每帧计算后回调本函数）
     槽位 li 持久存在（点击/悬浮监听只绑定一次），内容与 data-slug 动态更新 */
  var colL = document.querySelector('.gidx-left'),
      colR = document.querySelector('.gidx-right');
  var SLOT = [];
  for (var s = 0; s < 12; s++){
    var li = document.createElement('li');
    li.setAttribute('data-is-hovered', 'false');
    li.innerHTML = '<span class="num"></span><span class="ttl"></span>';
    (s < 6 ? colL : colR).appendChild(li);
    SLOT.push({ li: li, num: li.children[0], ttl: li.children[1], item: -1 });
  }
  window.GALLERY_INDEX_PROJECTS = [];
  var lastWin = -1;
  window.GalleryIndexUpdate = function(n){
    var projects = window.GALLERY_INDEX_PROJECTS;
    var total = projects.length;
    if (!total) return;
    n = ((n % total) + total) % total;
    /* 分页窗口：右列 = 当前浏览所在的 6 张一组，左列 = 前一组；
       浏览编号未超出本组时文字保持不动，跨组瞬间才整组刷新 */
    var win = Math.floor(n / 6) * 6;
    if (win !== lastWin){
      lastWin = win;
      for (var k = 0; k < 12; k++){
        var st = SLOT[k];
        var raw = k < 6 ? win - 6 + k : win + k - 6;
        var idx = ((raw % total) + total) % total;
        var pr = projects[idx];
        st.item = idx;
        st.li.setAttribute('data-slug', pr.slug);
        st.li.setAttribute('title', (pr.titleZh ? pr.titleZh + ' · ' : '') + pr.photographer);
        st.num.textContent = String(idx + 1).padStart(2, '0') + '/';
        st.ttl.textContent = pr.title;
      }
    }
    /* 透明度反馈：当前照片最亮，按循环距离衰减；当前项加 .is-cur（樱花粉加粗）；悬停中的槽位跳过 */
    for (var j = 0; j < 12; j++){
      var s2 = SLOT[j];
      var d = Math.abs(s2.item - n);
      d = Math.min(d, total - d);
      s2.li.classList.toggle('is-cur', d === 0);
      if (s2.li.dataset.isHovered === 'true') continue;
      var o = .15 + .85 * Math.pow(1 - Math.min(d / 6, 1), 3);
      window.gsap.to(s2.li, { opacity: o, duration: 1, ease: 'power3.out', overwrite: 'auto' });
    }
  };

  /* 定稿流程：全部清单条目预检 → 过滤缺失 → 渲染索引 */
  window.GALLERY_PROJECTS_READY = Promise.all(ordered.map(function(p, idx){
    return preflight(toProject(p, idx));
  })).then(function(results){
    var chosen = [];
    results.forEach(function(r){ if (r) chosen.push(r); });
    window.GALLERY_PROJECTS = chosen;
    window.GALLERY_INDEX_PROJECTS = chosen;
    window.GalleryIndexUpdate(0);
  });
})();
</script>

<script>
/* ============================================================
   图片详情面板（与旧画廊 .photo-detail 同款体验）
   · 点击中央照片（十字准星 OPEN PROJECT）/ 按 Enter 打开
   · 大图 + N°编号 + 分类·日期 + 中英标题 + 署名 + 拍摄参数
   · 摄影手记：优先加载图片同名 .json 旁车，无则按标题生成
   · PREV / NEXT 在精选照片间循环；ALL / ESC 返回画廊
   ============================================================ */
(function(){
  var panel = document.getElementById('photoDetail');
  var imgEl      = panel.querySelector('.pd-img img');
  var imgWrap    = panel.querySelector('.pd-img');
  var plateEl    = panel.querySelector('.pd-cap .pd-plate');
  var titleEnEl  = panel.querySelector('.pd-cap .pd-title-en');
  var titleZhEl  = panel.querySelector('.pd-cap .pd-title-zh');
  var byEl       = panel.querySelector('.pd-cap .pd-by');
  var byNameEl   = panel.querySelector('.pd-cap .pd-by-n');
  var prevBtn    = panel.querySelector('.pd-pagenation .prev');
  var nextBtn    = panel.querySelector('.pd-pagenation .next');
  var allBtn     = panel.querySelector('.pd-pagenation .all');
  var closeBtn   = panel.querySelector('.pd-close');

  var currentIdx = -1;
  var projects = [];

  /* 手机端详情优先 1280 变体（体积小，DPR2/3 下清晰）；
     无 1280 变体的图（原图本就 ≤1280 宽，多为竖图）直接用原图，
     不走偏软的 640；桌面端始终用原图保证质感 */
  var mobileMQ = window.matchMedia('(max-width: 768px)');
  function detailSrc(pr){
    if (!mobileMQ.matches) return pr.img;
    if (pr.src && /-1280\.webp$/.test(pr.src)) return pr.src;
    return pr.img;
  }

  /* 预加载缓存：打开面板及每次切换后预热相邻两张，下一次点击基本秒切 */
  var preloadCache = {};
  function preloadPhoto(pr){
    if (!pr) return;
    var u = detailSrc(pr);
    if (!preloadCache[u]){
      preloadCache[u] = new Image();
      preloadCache[u].src = u;
    }
  }
  function preloadNeighbours(idx){
    var n = projects.length;
    if (n < 2) return;
    preloadPhoto(projects[(idx + 1) % n]);
    preloadPhoto(projects[(idx - 1 + n) % n]);
  }

  function setContent(idx){
    var pr = projects[idx];
    if (!pr) return;
    /* 大图：手机走 1280 变体，桌面走原图（浏览器均已缓存对应版本） */
    imgEl.src = detailSrc(pr);
    imgEl.alt = pr.imgAlt || pr.titleZh || '';
    imgWrap.classList.toggle('is-portrait', pr.format === 'portrait');
    imgWrap.classList.toggle('is-landscape', pr.format !== 'portrait');
    imgWrap.classList.toggle('is-square', pr.ratio === 'ar-1');

    /* 馆藏铭牌：编号 / 英文大斜题 / 中文疏排 / 作者署名 */
    plateEl.innerHTML = 'Plate N° ' + String(idx + 1).padStart(2, '0') +
      '<em><b>/</b>' + String(projects.length).padStart(2, '0') + '</em>';
    titleEnEl.textContent = pr.title || pr.titleZh || '';
    titleZhEl.textContent = pr.titleZh && pr.titleZh !== pr.title ? pr.titleZh : '';
    titleZhEl.style.display = titleZhEl.textContent ? '' : 'none';
    byNameEl.textContent = pr.photographer || '';
    byEl.style.display = pr.photographer ? '' : 'none';
  }

  function openPanel(idx){
    if (idx < 0 || idx >= projects.length) return;
    currentIdx = idx;
    setContent(idx);
    preloadNeighbours(idx);
    panel.classList.remove('is-in');
    panel.scrollTop = 0;
    panel.classList.add('is-open');
    panel.setAttribute('aria-hidden', 'false');
    requestAnimationFrame(function(){
      requestAnimationFrame(function(){ panel.classList.add('is-in'); });
    });
  }
  var switchToken = 0;
  function switchPanel(dir){
    if (currentIdx < 0) return;
    var n = projects.length;
    var next = dir === 'next' ? (currentIdx + 1) % n : (currentIdx - 1 + n) % n;
    currentIdx = next;
    panel.classList.remove('is-in');
    panel.classList.add('is-switching');
    panel.scrollTop = 0;

    /* 等目标图下载就绪后再换内容：图片与图注同一刻更新，
       避免手机慢网下"文字已换、图片还停在上一张"。
       token 作废慢网期间被新点击/关闭取代的旧等待 */
    var myToken = ++switchToken;
    var startedAt = Date.now();
    function commit(){
      if (myToken !== switchToken) return;
      var elapsed = Date.now() - startedAt;
      var wait = Math.max(0, 340 - elapsed); /* 至少播完 340ms 淡出 */
      setTimeout(function(){
        if (myToken !== switchToken) return;
        setContent(next);
        preloadNeighbours(next);
        panel.classList.remove('is-switching');
        requestAnimationFrame(function(){
          requestAnimationFrame(function(){ panel.classList.add('is-in'); });
        });
      }, wait);
    }
    var probe = new Image();
    probe.onload = commit;
    probe.onerror = commit; /* 加载失败也放行（setContent 内 img 自身会再尝试） */
    probe.src = detailSrc(projects[next]);
    if (probe.complete) commit();
  }
  function closePanel(){
    switchToken++; /* 作废任何进行中的切换等待 */
    panel.classList.remove('is-in');
    panel.classList.remove('is-switching');
    setTimeout(function(){
      panel.classList.remove('is-open');
      panel.setAttribute('aria-hidden', 'true');
      currentIdx = -1;
    }, 360);
  }

  closeBtn.addEventListener('click', function(e){ e.stopPropagation(); closePanel(); });
  prevBtn.addEventListener('click', function(e){ e.stopPropagation(); switchPanel('prev'); });
  nextBtn.addEventListener('click', function(e){ e.stopPropagation(); switchPanel('next'); });
  allBtn.addEventListener('click', function(e){ e.stopPropagation(); closePanel(); });
  panel.addEventListener('click', function(e){ if (e.target === panel) closePanel(); });
  /* 面板交互元素均为 <button>/<a>，gallery.js 的 document 点击逻辑会自动跳过；
     空白处点击即使触发射线检测，WebGLGallery_onOpen 在面板打开时也有 is-open 守卫 */

  document.addEventListener('keydown', function(e){
    if (!panel.classList.contains('is-open')) return;
    if (e.key === 'Escape') closePanel();
    else if (e.key === 'ArrowLeft') switchPanel('prev');
    else if (e.key === 'ArrowRight') switchPanel('next');
  });

  /* WebGL 画廊回调：gallery.js 在点击当前激活照片/按 Enter 时以 slug 调用 */
  window.WebGLGallery_onOpen = function(slug){
    if (panel.classList.contains('is-open')) return;
    projects = window.GALLERY_PROJECTS || [];
    var idx = projects.findIndex(function(p){ return p.slug === slug; });
    if (idx === -1) idx = 0;
    openPanel(idx);
  };
})();
</script>
<script>
/* ============================================================
   顶栏抽屉导航（站点同款交互，与 js/app.js 行为一致）
   · 汉堡按钮两横线 ↔ 关闭交叉淡入
   · 点击背景 / ESC / 页内锚点关闭（本页 body 本身 overflow:hidden，无需滚动锁）
   ============================================================ */
(function(){
  var btn = document.getElementById('g-menu-btn');
  var menu = document.getElementById('g-menu');
  if (!btn || !menu) return;
  var htmlEl = document.documentElement;
  function openMenu(){ htmlEl.classList.add('is-menu-open'); menu.setAttribute('aria-hidden', 'false'); }
  function closeMenu(){ htmlEl.classList.remove('is-menu-open'); menu.setAttribute('aria-hidden', 'true'); }
  btn.addEventListener('click', function(){ htmlEl.classList.contains('is-menu-open') ? closeMenu() : openMenu(); });
  /* 汉堡按钮 hover：用 .is-hover 类驱动上线收短（补充 :hover，确保触发可靠） */
  btn.addEventListener('mouseenter', function(){ btn.classList.add('is-hover'); });
  btn.addEventListener('mouseleave', function(){ btn.classList.remove('is-hover'); });
  menu.querySelector('.bg').addEventListener('click', closeMenu);
  document.addEventListener('keydown', function(e){ if (e.key === 'Escape') closeMenu(); });
  menu.querySelectorAll('a[href^="#"]').forEach(function(a){ a.addEventListener('click', closeMenu); });
  /* 搜索：本页即画廊页，提交后仅关闭抽屉（不重复跳转） */
  menu.querySelector('.search form').addEventListener('submit', function(e){
    e.preventDefault();
    closeMenu();
  });
})();
</script>
