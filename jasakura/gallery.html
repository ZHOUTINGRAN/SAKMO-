<script>
/* ============================================================
   影像画廊渲染 — 从 gallery-data.js 数据动态生成卡片
   必须在 app.js 之前执行（筛选绑定需要卡片已存在）
   添加新图片只需编辑 js/gallery-data.js，无需改此文件
   ============================================================ */
(function(){
  if (!window.galleryItems || !galleryItems.length) return;
  var grid = document.getElementById('gallery-grid');
  if (!grid) return;

  galleryItems.forEach(function(p){
    var a = document.createElement('a');
    a.href = 'reading.html';
    a.className = 'item ' + (p.span || 's4');
    if (p.cat) a.setAttribute('data-cat', p.cat);
    a.innerHTML =
      '<div class="img ' + (p.ratio || 'ar-43') + '" data-zoom>' +
        '<img loading="lazy" alt="' + (p.imgAlt || '') + '" src="' + p.img + '">' +
      '</div>' +
      '<div class="lbl"><span>' + (p.catLabel || '') + '</span><span>' + (p.date || '') + '</span></div>' +
      '<h3>' + (p.title || '') + '<span class="en">' + (p.titleEn || '') + '</span></h3>' +
      '<div class="credit"><b>' + (p.photographer || '') + '</b> · ' + (p.role || '') + '</div>' +
      (p.params ? '<div class="params">' + p.params + '</div>' : '');
    grid.appendChild(a);
  });
})();
</script>
